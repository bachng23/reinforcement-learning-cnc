[project]
name = "jcst-runtime"
version = "0.1.0"
description = "Isolated CPU inference environment for the pinned JCST source bundle"
requires-python = ">=3.12,<3.13"
dependencies = ["torch==2.14.0", "numpy==2.4.4", "pydantic==2.13.3"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[dependency-groups]
dev = ["pytest==9.0.3"]
