services:
  ai_service:
    build:
      context: ./ai_services
    ports:
      - "127.0.0.1:${AI_SERVICE_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  # One-shot read-only demo against an explicitly seeded database.
  operations_plan_demo:
    profiles: [operations-demo]
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: development
      OPERATIONS_DEMO_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgre_db:5432/${POSTGRES_DB}?schema=public
      AI_SERVICE_URL: http://ai_service:8000
      AI_TRANSPORT_ALLOWANCE_MS: ${AI_TRANSPORT_ALLOWANCE_MS:-2000}
    command: ["npm", "run", "operations:plan-demo"]
    depends_on:
      postgre_db:
        condition: service_healthy
      ai_service:
        condition: service_healthy

  postgre_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
