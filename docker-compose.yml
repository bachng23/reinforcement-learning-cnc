services:
  research_api:
    profiles: [research]
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["127.0.0.1:5000:5000"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgre_db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:-}
      CLIENT_URL: http://localhost:3000
      RESEARCH_API_ENABLED: "${RESEARCH_API_ENABLED:-true}"
      LEGACY_RESEARCH_WRITE_ENABLED: "false"
      RESEARCH_ARTIFACT_DIR: /research-artifacts
    volumes: [research_artifacts:/research-artifacts]
    depends_on:
      postgre_db: { condition: service_healthy }

  research_worker:
    profiles: [research]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["node", "src/research/worker.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgre_db:5432/${POSTGRES_DB}
      RESEARCH_ARTIFACT_DIR: /research-artifacts
    volumes: [research_artifacts:/research-artifacts]
    depends_on:
      postgre_db: { condition: service_healthy }

  research_web:
    profiles: [research]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_RESEARCH_ENABLED: "${NEXT_PUBLIC_RESEARCH_ENABLED:-true}"
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [research_api]
  ai_service:
    build:
      context: ./ai_services
    ports:
      - "127.0.0.1:${AI_SERVICE_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  # One-shot read-only demo against an explicitly seeded database.
  scenario_worker:
    profiles: [scenario]
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgre_db:5432/${POSTGRES_DB}?schema=public
      AI_SERVICE_URL: http://ai_service:8000
      SCENARIO_ENGINE_VERSION: scenario-evaluator:1.0.0
      SCENARIO_CONTRACT_VERSION: scenario-engine:1.0
      SCENARIO_SAMPLING_VERSION: scenario-crn:1
    command: ["npm", "run", "operations:scenario-worker"]
    depends_on:
      postgre_db:
        condition: service_healthy
      ai_service:
        condition: service_healthy

  operations_plan_demo:
    profiles: [operations-demo]
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: development
      OPERATIONS_DEMO_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgre_db:5432/${POSTGRES_DB}?schema=public
      AI_SERVICE_URL: http://ai_service:8000
      AI_TRANSPORT_ALLOWANCE_MS: ${AI_TRANSPORT_ALLOWANCE_MS:-2000}
    command: ["npm", "run", "operations:plan-demo"]
    depends_on:
      postgre_db:
        condition: service_healthy
      ai_service:
        condition: service_healthy

  postgre_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  research_artifacts:
  postgres_data:
