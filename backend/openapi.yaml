                      episode_id: 'experiment:b83c24df-ad54-442e-a399-9dc31708f157:episode:0'
                      step: 0
                      outcomes:
                        - machine_id: machine-01
                          requested_action: CONTINUE
                          outcome: CONTINUED
                          tool_id_before: tool-01
                          tool_id_after: null
                          incurred_cost: 0
                      inventory_after:
                        spares_available: 2
                        capacity: 3
                      total_cost: 0
                      episode_terminated: false
                    createdAt: '2026-09-02T08:04:02.000Z'
                meta:
