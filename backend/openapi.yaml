        COMMIT is a separate transport command, NOT a HumanDecisionType. It requires APPROVED, LIVE, the exact
        approved candidate/hash, and current basis.

        This transport adapts command to canonical HumanDecisionRequest.decision and candidate_version to its
        expected_plan_version. The transport expected_plan_version instead fences OperationsHead.plan_version.
        expected_case_revision fences case state; Schedule.revision is a fourth independent value and is
        published unchanged.

        All commands require snapshot and head tokens matching the case basis and current head. Publish stores
        the exact candidate schedule and increments head plan_version once.

        Idempotency-Key is 1-128 printable non-space ASCII characters, scoped to factory + authenticated
        actor, shared with case creation and all commands/cases in that factory. Use a NEW key for each
        logical command. Same key/body returns the original 200 body with Idempotency-Replayed: true even
        after context/status changes; different body/command/case returns 409 IDEMPOTENCY_KEY_REUSED.
        Authorization is rechecked before replay. Receipts have no expiry; failed transactions leave no
        receipt. Request property order is ignored; omitted and explicit fields are distinct.

        Server owns actor, time, hashes and status. Unknown fields, MODIFY, replacement schedules, and
        actor/time input are rejected. Do not reuse the older frontend DTO with candidate_revision/reason.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[!-~]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionCommandRequest'
            examples:
              APPROVE:
                value:
                  schema_version: '3.0'
                  decision_case_id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                  recommendation_id: recommendation-1
                  expected_snapshot_id: snapshot-1
                  expected_case_revision: 6
                  expected_plan_version: 0
                  command: APPROVE
                  candidate_plan_id: candidate-1
                  candidate_version: 17
              REJECT:
                value:
                  schema_version: '3.0'
                  decision_case_id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                  recommendation_id: recommendation-1
                  expected_snapshot_id: snapshot-1
                  expected_case_revision: 6
                  expected_plan_version: 0
                  command: REJECT
                  note: Maintenance conflict
              COMMIT:
                value:
                  schema_version: '3.0'
                  decision_case_id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                  recommendation_id: recommendation-1
                  expected_snapshot_id: snapshot-1
                  expected_case_revision: 7
                  expected_plan_version: 0
                  command: COMMIT
                  candidate_plan_id: candidate-1
                  candidate_version: 17
      responses:
        '200':
          description: 'Atomic receipt. Replay returns the original response, not a fresh read.'
