      properties:
        machine_id:
          type: string
          minLength: 1
          maxLength: 128
        basis_snapshot_id:
          type: string
          minLength: 1
          maxLength: 128
    IncidentSource:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - type
