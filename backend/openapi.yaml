            - unavailable
            - not_found
      description: >-
        Active link identity only. Target summary comes from authorized producer contract; not invented here.
        Maximum50 active links per incident.
    IncidentReadMeta:
      type: object
      required:
        - read_at
      properties:
        read_at:
          type: string
          format: date-time
    IncidentPageMeta:
      type: object
      required:
        - read_at
        - limit
        - has_more
        - next_cursor
      properties:
        read_at:
          type: string
          format: date-time
        limit:
          type: integer
        has_more:
          type: boolean
        next_cursor:
          type:
            - string
            - 'null'
    IncidentHistoryMeta:
      type: object
      required:
        - read_at
        - has_more
        - next_after_sequence
      properties:
        read_at:
          type: string
          format: date-time
        has_more:
          type: boolean
        next_after_sequence:
          type: integer
          minimum: 0
    IncidentEventPage:
      type: object
      required:
        - success
        - data
        - meta
      properties:
        success:
          const: true
        data:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - incident_id
              - sequence
              - command
              - actor_id
              - occurred_at
              - payload
            properties:
              id:
                type: string
                format: uuid
              incident_id:
                type: string
                format: uuid
              sequence:
                type: integer
                minimum: 1
              command:
                type: string
              actor_id:
                type: string
                format: uuid
              occurred_at:
                type: string
                format: date-time
              payload:
                type: object
                description: Allowlisted per command; no raw source/target request or private artifact.
        meta:
          $ref: '#/components/schemas/IncidentHistoryMeta'
    IncidentOccurrencePage:
      type: object
      required:
        - success
        - data
        - meta
      properties:
        success:
          const: true
        data:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - incident_id
              - sequence
              - factory_id
              - source
              - machine
              - actor_id
              - recorded_at
              - evidence
            properties:
              id:
                type: string
                format: uuid
              incident_id:
                type: string
                format: uuid
              sequence:
                type: integer
                minimum: 1
              factory_id:
                type: string
              source:
                $ref: '#/components/schemas/IncidentSource'
              machine:
                anyOf:
                  - $ref: '#/components/schemas/IncidentMachine'
                  - type: 'null'
              actor_id:
                type: string
                format: uuid
              recorded_at:
                type: string
                format: date-time
              evidence:
                $ref: '#/components/schemas/IncidentEvidence'
        meta:
          $ref: '#/components/schemas/IncidentHistoryMeta'
    IncidentEvidence:
      oneOf:
        - $ref: '#/components/schemas/IncidentManualIncidentEvidence'
        - $ref: '#/components/schemas/IncidentCaseHealthAlertEvidence'
      discriminator:
        propertyName: kind
    IncidentManualIncidentEvidence:
      type: object
      additionalProperties: false
      required:
        - kind
        - report_text
      properties:
        kind:
          const: manual
        report_text:
          $ref: '#/components/schemas/IncidentNote'
      description: Human report only; no claim of measured health or physical recovery.
    IncidentCaseHealthAlertEvidence:
      type: object
      additionalProperties: false
      required:
        - kind
        - case_id
        - factory_id
        - basis_snapshot_id
        - case_created_at
        - machine_id
        - trigger
        - health_samples
      properties:
        kind:
          const: case_health_alert
        case_id:
          type: string
          format: uuid
        factory_id:
          type: string
          minLength: 1
          maxLength: 128
        basis_snapshot_id:
          type: string
          minLength: 1
          maxLength: 128
        case_created_at:
          type: string
          format: date-time
        machine_id:
          type: string
          minLength: 1
          maxLength: 128
        trigger:
          type: object
          additionalProperties: false
          required:
            - type
            - failure_probability
            - alert_threshold
          properties:
            type:
              const: HEALTH_ALERT
            failure_probability:
              type: number
              minimum: 0
              maximum: 1
            alert_threshold:
              type: number
              minimum: 0
              maximum: 1
          description: >-
            Validated trigger probability meets its threshold. No inferred severity. Product request does not
            persist canonical event_id/occurred_at; never fabricate them from case creation time.
        health_samples:
          type: array
          items:
            $ref: '#/components/schemas/IncidentHealthEvidence'
          description: >-
            Only matching machine samples in the immutable basis; empty when absent. These are evidence
            samples, not a sensor-history series.
    IncidentHealthEvidence:
      type: object
      additionalProperties: false
      required:
        - health_snapshot_id
        - machine_id
        - observed_at
        - health_index
        - failure_probability_horizon_minutes
        - failure_probability
        - confidence
        - source_model_version
      properties:
        health_snapshot_id:
          type: string
          minLength: 1
          maxLength: 128
        machine_id:
          type: string
          minLength: 1
          maxLength: 128
        observed_at:
          type: string
          format: date-time
        health_index:
          type: number
          minimum: 0
          maximum: 1
        failure_probability_horizon_minutes:
          type: integer
          minimum: 1
        failure_probability:
          type: number
          minimum: 0
          maximum: 1
        confidence:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
        source_model_version:
          type: string
          minLength: 1
          maxLength: 128
