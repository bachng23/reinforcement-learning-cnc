  /operations/snapshot:
    get:
      tags:
        - Operations
      operationId: getOperationsSnapshot
      summary: Read current immutable FactorySnapshot
      description: >-
        Authenticated database read. Active ADMIN can read all factories; other roles need access from the
        configured FACTORY_ACCESS_SOURCE (active database membership or OPERATIONS_FACTORY_ACCESS environment
        grants). Unknown or inaccessible factories return 404. Validates canonical schema 3.0 and SHA-256
        content hashes. Cache-Control: no-store. Schedule is null if none exists. Schedule has no embedded
        schema_version per the canonical contract; meta supplies version 3.0.
      parameters:
        - name: factory_id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
          example: factory-demo-01
      responses:
        '200':
          description: Canonical payload and integrity metadata
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - meta
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    additionalProperties: false
                    required:
                      - factory_id
                      - snapshot_id
                      - schema_version
                      - captured_at
                      - plan_version
                      - current_schedule_id
                      - snapshot
                    properties:
                      factory_id:
                        type: string
                      snapshot_id:
                        type: string
                      schema_version:
                        const: '3.0'
                      captured_at:
                        type: string
                        format: date-time
                      plan_version:
                        type: integer
                        minimum: 0
                      current_schedule_id:
                        type:
                          - string
                          - 'null'
                      snapshot:
                        $ref: '#/components/schemas/OperationsFactorySnapshot'
                  meta:
                    $ref: '#/components/schemas/OperationsReadMeta'
        '400':
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsErrorResponse'
        '404':
          description: Unknown or inaccessible factory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsErrorResponse'
        '500':
          description: Stored content failed integrity checks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsErrorResponse'
        '503':
          description: Database or validator unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsErrorResponse'
