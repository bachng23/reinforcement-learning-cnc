          $ref: '#/components/responses/Incident'
        default:
          $ref: '#/components/responses/IncidentError'
  '/incidents/{id}/commands':
    parameters:
      - $ref: '#/components/parameters/IncidentId'
    post:
      operationId: commandIncident
      parameters:
        - $ref: '#/components/parameters/IncidentKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentCommand'
      responses:
        '200':
          $ref: '#/components/responses/Incident'
        default:
          $ref: '#/components/responses/IncidentError'
  '/incidents/{id}/events':
    parameters:
      - $ref: '#/components/parameters/IncidentId'
    get:
      operationId: listIncidentEvents
      parameters:
        - $ref: '#/components/parameters/IncidentAfter'
        - $ref: '#/components/parameters/IncidentHistoryLimit'
      responses:
        '200':
          description: 'Append-only sanitized history, ordered by sequence ascending.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentEventPage'
        default:
          $ref: '#/components/responses/IncidentError'
  '/incidents/{id}/occurrences':
    parameters:
      - $ref: '#/components/parameters/IncidentId'
    get:
      operationId: listIncidentOccurrences
      parameters:
        - $ref: '#/components/parameters/IncidentAfter'
        - $ref: '#/components/parameters/IncidentHistoryLimit'
      responses:
        '200':
          description: 'Immutable, authorized source references in sequence order; no raw case request.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentOccurrencePage'
        default:
          $ref: '#/components/responses/IncidentError'
  '/incidents/{id}/links':
    parameters:
      - $ref: '#/components/parameters/IncidentId'
    post:
      operationId: linkIncidentTarget
      parameters:
        - $ref: '#/components/parameters/IncidentKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - expected_revision
                - target
              properties:
                expected_revision:
                  type: integer
                  minimum: 1
                target:
                  type: object
                  additionalProperties: false
                  required:
                    - type
                    - id
                  properties:
                    type:
                      type: string
                      enum:
                        - case
                        - work_order
                    id:
                      type: string
                      format: uuid
      responses:
        '200':
          $ref: '#/components/responses/Incident'
        default:
          $ref: '#/components/responses/IncidentError'
  '/incidents/{id}/links/{link_id}':
    parameters:
      - $ref: '#/components/parameters/IncidentId'
      - name: link_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: unlinkIncidentTarget
      parameters:
        - $ref: '#/components/parameters/IncidentKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - expected_revision
                - reason
              properties:
                expected_revision:
                  type: integer
                  minimum: 1
                reason:
                  $ref: '#/components/schemas/IncidentNote'
      responses:
        '200':
          $ref: '#/components/responses/Incident'
        default:
          $ref: '#/components/responses/IncidentError'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: pdm_token
      description: HttpOnly browser session cookie issued by POST /auth/login.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ExperimentId:
      name: experimentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EpisodeId:
      name: episodeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Attempt:
      name: attempt
      in: query
      required: false
      description: Episode attempt to read. Defaults to the current attempt.
      schema:
        type: integer
        minimum: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque client-generated key. Reuse it when retrying the same run request.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
    IncidentFactory:
      name: factory_id
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IncidentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IncidentKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: '^[!-~]{1,128}$'
    IncidentAfter:
      name: after_sequence
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    IncidentHistoryLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
  responses:
    Unauthorized:
      description: 'Missing, malformed, expired, or inactive-user authentication.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: Authentication required
    Forbidden:
      description: >-
        The authenticated role does not permit this mutation. Ownership mismatches are intentionally returned
        as 404.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: FORBIDDEN
              message: You do not have permission to access this resource
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: Resource not found
    ValidationError:
      description: 'Request body, path, or query validation failed.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: horizon_steps must be greater than or equal to 1
              details:
                - path: environmentConfig.horizon_steps
                  code: too_small
                  message: Must be greater than or equal to 1
    Conflict:
      description: A uniqueness or resource-state conflict prevented the operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: CONFLICT
              message: The requested operation conflicts with current state
    InvalidEpisodeTransition:
      description: The episode is not in the state required by this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: INVALID_EPISODE_TRANSITION
              message: Episode must be FAILED before it can be retried
    DatabaseUnavailable:
      description: PostgreSQL is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: DB_UNAVAILABLE
              message: Database unavailable. Check DATABASE_URL and make sure Postgres is running.
    Incident:
      description: Incident projection; replay returns historical body. Refetch before the next command.
      headers:
        Cache-Control:
          schema:
            const: no-store
        Idempotency-Replayed:
          schema:
            type: boolean
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IncidentEnvelope'
    IncidentError:
      description: >-
        400 validation; 401 inactive/unauthenticated; 403 role; scoped 404; 409 revision/state/source/key
        conflict; 500 integrity; 503 DB/linked target unavailable. No raw evidence or diagnostics.
      headers:
        Cache-Control:
          schema:
            const: no-store
      content:
        application/json:
          schema:
            type: object
            required:
              - success
              - error
              - requestId
            properties:
              success:
                const: false
              error:
                type: object
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
              requestId:
                type: string
  schemas:
    WorkOrderEligibleAssigneesResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - user_id
              - username
            properties:
              user_id:
                type: string
                format: uuid
              username:
                type: string
        meta:
          type: object
          additionalProperties: false
          required:
            - read_at
            - timezone
            - has_more
            - next_after
          properties:
            read_at:
              type: string
              format: date-time
            timezone:
              type: string
              enum:
                - UTC
            has_more:
              type: boolean
            next_after:
              type:
                - string
                - 'null'
              format: uuid
    WorkOrderOriginResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          additionalProperties: false
          required:
            - id
          properties:
            id:
              type: string
              format: uuid
        meta:
          type: object
          additionalProperties: false
          required:
            - read_at
            - timezone
          properties:
            read_at:
              type: string
              format: date-time
            timezone:
              type: string
              enum:
                - UTC
    MaintenanceAnalyticsMeta:
      type: object
      additionalProperties: false
      properties:
        read_at:
          type: string
          format: date-time
        metric_definition_version:
          const: maintenance-analytics.v1
        filters:
          oneOf:
            - type: object
              additionalProperties: false
              properties:
                factory_id:
                  type: string
                machine_id:
                  type:
                    - string
                    - 'null'
              required:
                - factory_id
                - machine_id
            - type: 'null'
        period:
          oneOf:
            - type: object
              additionalProperties: false
              properties:
                from:
                  type: string
                  format: date-time
                to:
                  type: string
                  format: date-time
              required:
                - from
                - to
            - type: 'null'
        timezone:
          type: string
        comparison_period:
          oneOf:
            - type: object
              additionalProperties: false
              properties:
                from:
                  type: string
                  format: date-time
                to:
                  type: string
                  format: date-time
              required:
                - from
                - to
            - type: 'null'
      required:
        - read_at
        - metric_definition_version
        - filters
        - period
        - timezone
        - comparison_period
    MaintenanceAnalyticsCount:
      type: object
      additionalProperties: false
      properties:
        value:
          type: integer
          minimum: 0
        availability:
          const: AVAILABLE
        verification:
          type: object
          additionalProperties: false
          properties:
            VERIFIED:
              type: integer
            VERIFIED_STOPPED:
              type: integer
          required:
            - VERIFIED
            - VERIFIED_STOPPED
      required:
        - value
        - availability
    MaintenanceAnalyticsRate:
      type: object
      additionalProperties: false
      properties:
        value:
          type:
            - number
            - 'null'
        numerator:
          type: integer
          minimum: 0
        denominator:
          type: integer
          minimum: 0
        availability:
          enum:
            - AVAILABLE
            - NO_DATA
      required:
        - value
        - numerator
        - denominator
        - availability
    MaintenanceAnalyticsDuration:
      type: object
      additionalProperties: false
      properties:
        median:
          type:
            - number
            - 'null'
        p90:
          type:
            - number
            - 'null'
        sample_count:
          type: integer
          minimum: 0
        excluded_count:
          type: integer
          minimum: 0
        exclusions:
          type: object
          additionalProperties: false
          properties:
            MISSING_HISTORY:
              type: integer
            INCONSISTENT_HISTORY:
              type: integer
          required:
            - MISSING_HISTORY
            - INCONSISTENT_HISTORY
        availability:
          enum:
            - AVAILABLE
            - NO_DATA
            - PARTIAL
        unit:
          const: seconds
      required:
        - median
        - p90
        - sample_count
        - excluded_count
        - exclusions
        - availability
        - unit
    MaintenanceAnalyticsDelta:
      type: object
      additionalProperties: false
      properties:
        absolute:
          type:
            - number
            - 'null'
        percent:
          type:
            - number
            - 'null'
      required:
        - absolute
        - percent
    MaintenanceAnalyticsDefinition:
      type: object
      additionalProperties: false
      properties:
        metric_key:
          enum:
            - open_orders
            - overdue_orders
            - blocked_orders
            - waiting_verification_orders
            - created_orders
            - closed_orders
