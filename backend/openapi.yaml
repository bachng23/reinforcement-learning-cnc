                          ACKNOWLEDGED:
                            type: integer
                            minimum: 0
                          INVESTIGATING:
                            type: integer
                            minimum: 0
                          RESOLVED:
                            type: integer
                            minimum: 0
                          CLOSED:
                            type: integer
                            minimum: 0
                      by_severity:
                        type: object
                        additionalProperties: false
                        required:
                          - INFO
                          - WARNING
                          - CRITICAL
                        properties:
                          INFO:
                            type: integer
                            minimum: 0
                          WARNING:
                            type: integer
                            minimum: 0
                          CRITICAL:
                            type: integer
                            minimum: 0
                      unconfirmed_severity:
                        type: integer
                        minimum: 0
                      unassigned:
                        type: integer
                        minimum: 0
                      awaiting_verification:
                        type: integer
