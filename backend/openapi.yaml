                    observationId: 6ae37db0-f05f-4238-961b-2c88d890e6dd
                    step: 0
                    attempt: 1
                    schemaVersion: '2.0'
                    totalCost: 0
                    episodeTerminated: false
                    payload:
                      schema_version: '2.0'
