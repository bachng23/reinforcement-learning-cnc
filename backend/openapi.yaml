          $ref: '#/components/responses/IncidentError'
    post:
      operationId: reportIncident
      parameters:
        - $ref: '#/components/parameters/IncidentKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentReport'
      responses:
        '200':
          description: Existing source identity returned without another occurrence; same Incident envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentEnvelope'
        '201':
          $ref: '#/components/responses/Incident'
        default:
          $ref: '#/components/responses/IncidentError'
  /incidents/summary:
