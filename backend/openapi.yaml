        resolution_code:
          type: string
          enum:
            - FIXED
            - FALSE_POSITIVE
            - NO_ACTION_REQUIRED
        note:
          $ref: '#/components/schemas/IncidentNote'
    IncidentCommand:
      type: object
      required:
        - command
        - expected_revision
