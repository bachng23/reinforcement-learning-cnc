              - INFO
              - WARNING
              - CRITICAL
              - UNCONFIRMED
        - name: owner_user_id
          in: query
          schema:
            type: string
            format: uuid
        - name: machine_id
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: q
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 4096
      responses:
        '200':
          description: 'Authorized AND-filtered page; created_at DESC, UUID DESC. Not a cross-page snapshot.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - meta
                properties:
                  success:
                    const: true
                  data:
