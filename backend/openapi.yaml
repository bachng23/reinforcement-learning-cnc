  '/decision-cases/{id}/events':
    get:
      summary: Read sanitized events ascending by sequence; limit + 1 determines has_more
      description: >-
        Read-only factory-authorized history; missing/inaccessible cases return 404 DECISION_CASE_NOT_FOUND.
        after_sequence is exclusive, default 0; limit defaults to 100 and is bounded 1..200. Sort by sequence
        ASC, never timestamp. Sequence is unique per case and need not equal case_revision (worker heartbeat
        revisions can have no event). Continue or poll using meta.next_after_sequence, even when
        has_more=false; empty pages echo the supplied sequence. Actor kind/id and occurred_at are
        server-owned. HUMAN CASE_STATUS_CHANGED events for APPROVE/REJECT/COMMIT include command,
        recommendation_id, candidate_plan_id/version/hash, schedule_hash and head plan_version. REJECT has
        null candidate fields. APPROVE/REJECT report unchanged head version; COMMIT reports the new version.
        Publication schedule ID/basis/time are available in case meta.commit or current-schedule commit
        metadata. Worker transitions have SYSTEM actors and may omit command fields. Unknown event types
        expose an empty payload. Raw request/artifact/snapshot, notes and leases are excluded. Every page
        rechecks authentication/factory access. Cache-Control: no-store.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: after_sequence
          schema:
            type: integer
            minimum: 0
            maximum: 2147483647
            default: 0
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        '200':
          description: 'Persisted, sanitized response'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionCaseEventsResponse'
              example:
                success: true
                data:
                  - id: cccccccc-cccc-4ccc-8ccc-ccccccccccc0
                    case_id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                    sequence: 7
                    type: CASE_STATUS_CHANGED
                    actor:
                      kind: HUMAN
                      id: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                    occurred_at: '2026-10-11T02:00:00.000Z'
                    payload:
                      from_status: AWAITING_APPROVAL
                      to_status: APPROVED
                      revision: 7
                      command: APPROVE
                      recommendation_id: recommendation-1
                      candidate_plan_id: candidate-1
                      candidate_version: 17
