  /work-orders:
    get:
      tags:
        - Work Orders
      operationId: listWorkOrders
      summary: List scoped maintenance work orders
      description: >-
        Strict fields/query; repeated query keys rejected. Fresh DB user and factory access. No-store on
        success and errors. Filters AND; created_at DESC,id DESC, microsecond cursor signed and
        actor/source/filter-bound. Cursor freezes overdue cutoff read_at. COMPLETED is overdue after
        planned_end_at but waiting_verification=true; not ongoing machine repair. Historical machine filters
        do not require current-snapshot presence.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: factory_id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - UNASSIGNED
              - ASSIGNED
              - ACCEPTED
              - IN_PROGRESS
              - BLOCKED
              - COMPLETED
              - CLOSED
              - CANCELLED
        - name: assignee_user_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: machine_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
        - name: overdue
          in: query
          required: false
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 4096
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderListResponse'
              example:
                success: true
                data:
                  - id: a0000000-0000-4000-8000-000000000001
                    factory_id: factory-A
                    machine_id: M03
                    maintenance_request_id: MR-M03
                    basis_snapshot_id: snapshot-basis-S1
                    source:
                      decision_case_id: a0000000-0000-4000-8000-000000000001
                      schedule_id: schedule-committed
                      schedule_revision: 1
                      schedule_hash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                      assignment_id: A-MAINT-M03
                      published_plan_version: 2
                      basis_snapshot_id: snapshot-basis-S1
                      basis_snapshot_hash: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                    status: UNASSIGNED
                    revision: 1
                    assignee: null
                    planned_start_at: '2026-10-22T01:00:00.000Z'
                    planned_end_at: '2026-10-22T02:00:00.000Z'
                    actual_started_at: null
                    actual_completed_at: null
                    created_at: '2026-10-22T00:00:00.000Z'
                    updated_at: '2026-10-22T00:00:00.000Z'
                    source_is_current: true
                    machine_in_current_snapshot: true
                    overdue: false
                    waiting_verification: false
                meta:
                  read_at: '2026-10-22T00:00:00.000Z'
                  timezone: UTC
                  limit: 25
                  has_more: false
                  next_cursor: null
        '400':
          description: VALIDATION_ERROR / INVALID_CURSOR
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderError'
        '401':
          description: UNAUTHORIZED
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderError'
        '403':
          description: FORBIDDEN / WORK_ORDER_NOT_ASSIGNEE / SELF_VERIFICATION
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderError'
        '404':
          description: WORK_ORDER_NOT_FOUND / FACTORY_NOT_FOUND
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderError'
        '409':
          description: >-
            WORK_ORDER_REVISION_CONFLICT / INVALID_WORK_ORDER_TRANSITION / WORK_ORDER_STATE_CONFLICT /
            WORK_ORDER_INDEPENDENT_VERIFICATION_REQUIRED / SOURCE_PLAN_CHANGED / INVALID_WORK_ORDER_SOURCE /
            WORK_ORDER_ORIGIN_EXISTS / ACTIVE_MAINTENANCE_REQUEST_EXISTS / WORK_ORDER_OVERLAP /
            ASSIGNEE_UNAVAILABLE / IDEMPOTENCY_KEY_REUSED
          headers:
            Cache-Control:
              schema:
                type: string
