      required:
        - factory_id
        - source
        - title
        - description
        - category
      properties:
        factory_id:
          type: string
          minLength: 1
          maxLength: 128
        source:
          $ref: '#/components/schemas/IncidentSource'
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
        description:
          $ref: '#/components/schemas/IncidentNote'
        category:
          $ref: '#/components/schemas/IncidentCategory'
        machine:
          $ref: '#/components/schemas/IncidentMachine'
        proposed_severity:
          $ref: '#/components/schemas/IncidentSeverity'
        severity:
          $ref: '#/components/schemas/IncidentSeverity'
        related_incident_reason:
          $ref: '#/components/schemas/IncidentNote'
      allOf:
        - if:
            properties:
              source:
                properties:
                  type:
                    const: case_health_alert
          then:
            not:
              required:
                - machine
      description: >-
        Official severity only ADMIN/ENGINEER; otherwise null until confirmation. From-case machine/evidence
        derived server-side. Unknown fields rejected.
