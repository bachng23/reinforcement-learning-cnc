      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          additionalProperties: false
          required: [id, attempt, payload, createdAt]
          properties:
            id:
              type: string
              format: uuid
            attempt:
              type: integer
              minimum: 1
            payload:
              $ref: "#/components/schemas/EpisodeSummary"
            createdAt:
              type: string
              format: date-time

    Identifier:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"
    EnvironmentConfig:
      type: object
      additionalProperties: false
      required:
        - environment_id
        - number_of_machines
        - spare_capacity
        - initial_spares
        - horizon_steps
        - failure_threshold_um
        - seed
        - costs
        - risk
      properties:
        schema_version:
          type: string
          const: "2.0"
        environment_id:
          $ref: "#/components/schemas/Identifier"
        number_of_machines:
          type: integer
          minimum: 1
        spare_capacity:
          type: integer
          minimum: 0
        initial_spares:
          type: integer
          minimum: 0
          description: Must not exceed spare_capacity.
        horizon_steps:
          type: integer
          minimum: 1
        failure_threshold_um:
          type: number
          exclusiveMinimum: 0
        seed:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Base seed; episode i uses seed + i without exceeding the maximum.
        costs:
          $ref: "#/components/schemas/CostConfig"
        risk:
          $ref: "#/components/schemas/RiskConfig"
    CostConfig:
      type: object
      additionalProperties: false
      required: [replacement_cost, failure_cost, waiting_cost_per_step, unused_life_cost_per_step]
      properties:
        replacement_cost:
          type: number
          minimum: 0
        failure_cost:
          type: number
          minimum: 0
        waiting_cost_per_step:
          type: number
          minimum: 0
        unused_life_cost_per_step:
          type: number
          minimum: 0
    RiskConfig:
      type: object
      additionalProperties: false
      required: [objective]
      properties:
        objective:
          type: string
          enum: [EXPECTED_COST, CVAR]
        cvar_alpha:
          type: number
          exclusiveMinimum: 0
          exclusiveMaximum: 1
          default: 0.95
    SharedInventoryState:
      type: object
      additionalProperties: false
      required: [spares_available, capacity]
      properties:
        spares_available:
          type: integer
          minimum: 0
          description: Must not exceed capacity.
        capacity:
          type: integer
          minimum: 0
    RULDistribution:
      type: object
      additionalProperties: false
      required: [support_steps, probability_mass, survival_beyond_horizon, model_version]
      properties:
        support_steps:
          type: array
          minItems: 2
          items:
            type: integer
            minimum: 0
        probability_mass:
          type: array
          minItems: 2
          items:
            type: number
            minimum: 0
            maximum: 1
        survival_beyond_horizon:
          type: number
          minimum: 0
          maximum: 1
        model_version:
          $ref: "#/components/schemas/Identifier"
    ToolBeliefState:
      type: object
      additionalProperties: false
      required: [tool_age_steps, observed_wear_um, posterior_median_wear_um, posterior_std_wear_um, rul_distribution]
      properties:
        tool_age_steps:
          type: integer
          minimum: 0
        observed_wear_um:
          type: number
          minimum: 0
        posterior_median_wear_um:
          type: number
          minimum: 0
        posterior_std_wear_um:
          type: number
          minimum: 0
        rul_distribution:
          $ref: "#/components/schemas/RULDistribution"
    MachineObservation:
      type: object
      additionalProperties: false
      required: [machine_id, tool_id, cutting_condition, tool_state]
      properties:
        machine_id:
          $ref: "#/components/schemas/Identifier"
        tool_id:
          $ref: "#/components/schemas/Identifier"
        job_id:
          anyOf:
            - $ref: "#/components/schemas/Identifier"
            - type: "null"
        cutting_condition:
          type: object
          additionalProperties: false
          required: [condition_id, load_class]
          properties:
            condition_id:
              $ref: "#/components/schemas/Identifier"
            load_class:
              type: string
              enum: [LIGHT, NOMINAL, HEAVY]
        tool_state:
          $ref: "#/components/schemas/ToolBeliefState"
    FleetObservation:
      type: object
      additionalProperties: false
      required: [schema_version, observation_id, episode_id, step, machines, inventory]
      properties:
        schema_version:
          type: string
          const: "2.0"
        observation_id:
          $ref: "#/components/schemas/Identifier"
        episode_id:
          $ref: "#/components/schemas/Identifier"
        step:
          type: integer
          minimum: 0
        machines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/MachineObservation"
        inventory:
          $ref: "#/components/schemas/SharedInventoryState"
    MachineAction:
      type: object
      additionalProperties: false
      required: [machine_id, action]
      properties:
        machine_id:
          $ref: "#/components/schemas/Identifier"
        action:
          type: string
          enum: [CONTINUE, REPLACE]
    JointAction:
      type: object
      additionalProperties: false
      required: [schema_version, observation_id, actions]
      properties:
        schema_version:
          type: string
          const: "2.0"
        observation_id:
          $ref: "#/components/schemas/Identifier"
        actions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/MachineAction"
    PolicyRecommendation:
      type: object
      additionalProperties: false
      required: [schema_version, observation_id, policy_id, policy_version, actions]
      properties:
        schema_version:
          type: string
          const: "2.0"
        observation_id:
          $ref: "#/components/schemas/Identifier"
        policy_id:
          $ref: "#/components/schemas/Identifier"
        policy_version:
          $ref: "#/components/schemas/Identifier"
        actions:
          $ref: "#/components/schemas/JointAction"
        estimated_expected_cost:
          type: [number, "null"]
          minimum: 0
        estimated_cvar_cost:
          type: [number, "null"]
          minimum: 0
    MachineStepOutcome:
      type: object
      additionalProperties: false
      required: [machine_id, requested_action, outcome, tool_id_before, incurred_cost]
      properties:
        machine_id:
          $ref: "#/components/schemas/Identifier"
        requested_action:
          type: string
          enum: [CONTINUE, REPLACE]
        outcome:
          type: string
          enum: [CONTINUED, REPLACED, WAITING_FOR_SPARE, FAILED]
        tool_id_before:
          $ref: "#/components/schemas/Identifier"
        tool_id_after:
          anyOf:
            - $ref: "#/components/schemas/Identifier"
            - type: "null"
        incurred_cost:
          type: number
          minimum: 0
    StepResult:
      type: object
      additionalProperties: false
      required: [schema_version, observation_id, episode_id, step, outcomes, inventory_after, total_cost, episode_terminated]
      properties:
        schema_version:
          type: string
          const: "2.0"
        observation_id:
          $ref: "#/components/schemas/Identifier"
        episode_id:
          $ref: "#/components/schemas/Identifier"
        step:
          type: integer
          minimum: 0
        outcomes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/MachineStepOutcome"
        inventory_after:
          $ref: "#/components/schemas/SharedInventoryState"
        total_cost:
          type: number
          minimum: 0
        episode_terminated:
          type: boolean
    EpisodeSummary:
      type: object
      additionalProperties: false
      required: [schema_version, episode_id, policy_id, seed, steps_completed, total_cost, failure_count, replacement_count, waiting_steps]
      properties:
        schema_version:
          type: string
          const: "2.0"
        episode_id:
          $ref: "#/components/schemas/Identifier"
        policy_id:
          $ref: "#/components/schemas/Identifier"
        seed:
          type: integer
          minimum: 0
        steps_completed:
          type: integer
          minimum: 0
        total_cost:
          type: number
          minimum: 0
        failure_count:
          type: integer
          minimum: 0
        replacement_count:
          type: integer
          minimum: 0
        waiting_steps:
          type: integer
          minimum: 0

    MaintenanceCandidate:
      type: object
      additionalProperties: false
      required: [id, decisionId, status, machineId, toolId, jobId, source, recommendedAction, severity, priority, risk, resources, predictedCost, costOfDelay, rationale, rationaleSource, result, createdAt]
      properties:
        id:
          type: string
          description: Stable recommendation UUID followed by ~ and the machine identifier.
        decisionId:
          type: [string, 'null']
          format: uuid
          description: Shared human review decision UUID, if opened.
        status:
          type: string
          enum: [PENDING_REVIEW, APPROVED, OVERRIDDEN, REJECTED]
          description: Status of the joint recommendation's human review; PENDING_REVIEW before a review row exists.
        machineId:
          $ref: '#/components/schemas/Identifier'
        toolId:
          $ref: '#/components/schemas/Identifier'
        jobId:
          type: [string, 'null']
        source:
          type: object
          additionalProperties: false
          required: [experimentId, episodeId, episodeIndex, attempt, step, observationId, recommendationId, policyId, resultId]
          properties:
            experimentId: { type: string, format: uuid }
            episodeId: { type: string, format: uuid }
            episodeIndex: { type: integer, minimum: 0 }
            attempt: { type: integer, minimum: 1 }
            step: { type: integer, minimum: 0 }
            observationId: { type: string, format: uuid }
            recommendationId: { type: string, format: uuid }
            policyId: { type: string, format: uuid }
            resultId: { type: string, format: uuid }
        recommendedAction:
          type: string
          enum: [REPLACE_NOW, SCHEDULE_REPLACEMENT, DEFER]
          description: REPLACE with spares maps to REPLACE_NOW, REPLACE without spares to SCHEDULE_REPLACEMENT, CONTINUE to DEFER.
        severity:
          type: string
          enum: [CRITICAL, HIGH, MEDIUM, LOW]
          description: >-
            CRITICAL at one-step failure probability >= 0.5 or wear >= threshold; HIGH at probability >= 0.25,
            wear >= 80% of threshold or policy REPLACE; MEDIUM at probability >= 0.1 or wear >= 50%; else LOW.
        priority:
          type: integer
          minimum: 1
          maximum: 4
          description: 1=CRITICAL, 2=HIGH, 3=MEDIUM, 4=LOW.
        risk:
          type: object
          additionalProperties: false
          required: [predictedRulSteps, failureProbabilityNextStep, observedWearUm, posteriorMedianWearUm, failureThresholdUm, condition]
          properties:
            predictedRulSteps:
              type: [integer, 'null']
              minimum: 0
              description: Median of the persisted RUL distribution; null if survival beyond horizon exceeds 50%.
            failureProbabilityNextStep:
              type: number
              minimum: 0
              maximum: 1
              description: Probability mass at RUL support steps 0 and 1.
            observedWearUm: { type: number, minimum: 0 }
            posteriorMedianWearUm: { type: number, minimum: 0 }
            failureThresholdUm: { type: number, exclusiveMinimum: 0 }
            condition:
              type: object
              additionalProperties: false
              required: [conditionId, loadClass]
              properties:
                conditionId: { $ref: '#/components/schemas/Identifier' }
                loadClass: { type: string, enum: [LIGHT, NOMINAL, HEAVY] }
        resources:
          type: object
          additionalProperties: false
          required: [sparesAvailable, inventoryCapacity]
          properties:
            sparesAvailable: { type: integer, minimum: 0 }
            inventoryCapacity: { type: integer, minimum: 0 }
        predictedCost:
          type: object
          additionalProperties: false
          required: [expected, cvar, scope]
          properties:
            expected: { type: [number, 'null'], minimum: 0 }
            cvar: { type: [number, 'null'], minimum: 0 }
            scope: { const: JOINT_RECOMMENDATION }
          description: Policy estimates for the whole joint action, not a machine-specific allocation.
        costOfDelay:
          type: object
          additionalProperties: false
          required: [amount, basis]
          properties:
            amount:
              type: [number, 'null']
              minimum: 0
              description: One-step failure probability multiplied by configured failure cost; null if cost is absent.
            basis: { const: ONE_STEP_FAILURE_EXPOSURE }
          description: Derived exposure proxy, not a counterfactual policy forecast.
        rationale:
          type: string
        rationaleSource:
          const: DERIVED_FROM_PERSISTED_EVENTS
          description: Policy payload has no free-text rationale; this text is composed from action and risk/resource snapshot.
        result:
          type: object
          additionalProperties: false
          required: [outcome, incurredCost]
          properties:
            outcome: { type: string, enum: [CONTINUED, REPLACED, WAITING_FOR_SPARE, FAILED] }
            incurredCost: { type: number, minimum: 0 }
          description: Persisted simulator outcome, not a maintenance execution acknowledgement.
        createdAt:
          type: string
          format: date-time
    MaintenanceCandidateResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success: { const: true }
        data: { $ref: '#/components/schemas/MaintenanceCandidate' }
    MaintenanceCandidateListResponse:
      type: object
      additionalProperties: false
      required: [success, data, meta]
      properties:
        success: { const: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/MaintenanceCandidate' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    MaintenanceReviewInput:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 4000
          description: Trimmed; must not be blank when supplied.
    MaintenanceOverrideInput:
      type: object
      additionalProperties: false
      required:
        - reason
        - replacementAction
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 4000
          pattern: \S
        replacementAction:
          $ref: '#/components/schemas/JointAction'
    MaintenanceDecision:
      type: object
      required:
        - id
        - recommendationId
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        recommendationId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - PENDING_REVIEW
            - APPROVED
            - OVERRIDDEN
            - REJECTED
        createdAt:
          type: string
          format: date-time
    MaintenanceDecisionAction:
      type: object
      required:
        - id
        - decisionId
        - actorUserId
        - fromStatus
        - toStatus
        - reason
        - selectedAction
        - recommendationSnapshot
        - riskSnapshot
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        decisionId:
          type: string
          format: uuid
        actorUserId:
          type: string
          format: uuid
        fromStatus:
          const: PENDING_REVIEW
        toStatus:
          enum:
            - APPROVED
            - OVERRIDDEN
            - REJECTED
        reason:
          type:
            - string
            - 'null'
        selectedAction:
          anyOf:
            - $ref: '#/components/schemas/JointAction'
            - type: 'null'
        recommendationSnapshot:
          type: object
          description: 'Recommendation ID, policy ID, schemaVersion and full payload captured at review time.'
        riskSnapshot:
          type: object
          description: >-
            Full observation (including RUL distributions) and environmentConfig (including risk objective and
            costs) captured at review time.
        createdAt:
          type: string
          format: date-time
