          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The worker has not persisted a final summary for this attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: SUMMARY_NOT_AVAILABLE
                  message: Episode summary is not available
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  '/episodes/{episodeId}/retry':
    parameters:
      - $ref: '#/components/parameters/EpisodeId'
    post:
      tags:
        - Episodes
      summary: Retry a failed episode
      description: >-
        Atomically transitions FAILED to PENDING, increments the attempt, and queues the same deterministic
        seed.
      operationId: retryEpisode
      responses:
        '202':
          description: Episode queued for another attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodeResponse'
              example:
                success: true
                data:
                  id: 4dd4f09f-d099-4e11-827f-1ad32906d640
                  episodeKey: 'experiment:b83c24df-ad54-442e-a399-9dc31708f157:episode:0'
                  experimentId: b83c24df-ad54-442e-a399-9dc31708f157
                  episodeIndex: 0
                  policyId: 4e822e39-4b5b-497f-b3ec-864f9c41967b
                  seed: 42
                  attempt: 2
                  status: PENDING
                  stepsCompleted: 0
                  totalCost: null
                  failureCount: null
                  replacementCount: null
                  waitingSteps: null
                  queuedAt: '2026-09-02T09:00:00.000Z'
                  startedAt: null
                  completedAt: null
                  failedAt: null
                  cancelledAt: null
                  error: null
                  createdAt: '2026-09-02T08:03:00.000Z'
                  updatedAt: '2026-09-02T09:00:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidEpisodeTransition'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  '/episodes/{episodeId}/cancel':
    parameters:
      - $ref: '#/components/parameters/EpisodeId'
    post:
      tags:
        - Episodes
      summary: Cancel a pending episode
      description: |
        Atomically transitions PENDING to CANCELLED. Every other state is
        rejected with INVALID_EPISODE_TRANSITION.
      operationId: cancelEpisode
      responses:
        '200':
          description: Pending episode cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodeResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The episode is not PENDING.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: INVALID_EPISODE_TRANSITION
                  message: Episode is RUNNING; expected PENDING
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /incidents:
    get:
      operationId: listIncidents
      parameters:
        - $ref: '#/components/parameters/IncidentFactory'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/IncidentStatus'
        - name: severity
          in: query
