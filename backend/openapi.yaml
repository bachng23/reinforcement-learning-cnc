          type: integer
          minimum: 1
      oneOf:
        - properties:
            command:
              const: ASSIGN
            owner_user_id:
              type: string
              format: uuid
          required:
            - owner_user_id
        - properties:
            command:
              const: REASSIGN
            owner_user_id:
              type: string
              format: uuid
            reason:
              $ref: '#/components/schemas/IncidentNote'
          required:
            - owner_user_id
            - reason
        - properties:
            command:
              enum:
                - ACKNOWLEDGE
                - START_INVESTIGATION
        - properties:
            command:
              const: CHANGE_SEVERITY
            severity:
              $ref: '#/components/schemas/IncidentSeverity'
            reason:
              $ref: '#/components/schemas/IncidentNote'
          required:
            - severity
            - reason
        - properties:
            command:
              const: MARK_RESOLVED
            resolution:
              $ref: '#/components/schemas/IncidentResolution'
            work_order_override_reason:
              $ref: '#/components/schemas/IncidentNote'
          required:
            - resolution
        - properties:
            command:
              const: CLOSE
            verification:
              $ref: '#/components/schemas/IncidentVerification'
            work_order_override_reason:
              $ref: '#/components/schemas/IncidentNote'
          required:
            - verification
        - properties:
            command:
              const: REOPEN
            reason:
              $ref: '#/components/schemas/IncidentNote'
          required:
            - reason
        - properties:
            command:
              const: APPEND_OCCURRENCE
