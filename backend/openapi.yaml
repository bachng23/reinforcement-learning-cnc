        - title
        - category
        - machine
        - source
        - severity
        - proposed_severity
        - status
        - owner_user_id
        - revision
        - first_occurred_at
        - last_occurred_at
        - occurrence_count
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        factory_id:
          type: string
        title:
          type: string
        category:
          $ref: '#/components/schemas/IncidentCategory'
        machine:
          anyOf:
            - $ref: '#/components/schemas/IncidentMachine'
            - type: 'null'
        source:
