  /maintenance/decisions:
    get:
      tags:
        - Maintenance
      operationId: listMaintenanceDecisionCandidates
      summary: List machine-level maintenance candidates from persisted simulator events
      description: >-
        Each complete observation, policy recommendation and step result produces one candidate per machine
        for the episode's current attempt. ADMIN can read all experiments; other users can read their own.
        Results are ordered by severity (CRITICAL first), estimated cost of one-step delay (highest first),
        creation time (newest first), then candidate id. The review status belongs to the shared joint
        recommendation; decisionId is null until POST /maintenance/decisions opens it for human review.
        Simulator results are research outcomes, not maintenance execution acknowledgements.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - PENDING_REVIEW
              - APPROVED
              - OVERRIDDEN
              - REJECTED
        - name: severity
          in: query
          schema:
            type: string
            enum:
              - CRITICAL
              - HIGH
              - MEDIUM
              - LOW
        - name: experiment
          in: query
          description: Experiment UUID.
          schema:
            type: string
            format: uuid
        - name: machine
          in: query
          description: Exact machine identifier.
          schema:
            $ref: '#/components/schemas/Identifier'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Filtered and prioritized candidates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceCandidateListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
    post:
      tags:
        - Maintenance
      operationId: createMaintenanceDecision
      summary: Open a recommendation for human review
      description: >-
        Requires authentication. ADMIN can access all decisions; other roles access decisions belonging to
        their own experiments. VIEWER can only read. No operation executes machine actions. OPERATOR,
        ENGINEER, ADMIN only. Idempotently returns the existing decision for this recommendation without
        resetting its status.
