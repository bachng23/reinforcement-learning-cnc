          $ref: '#/components/schemas/OperationsOverview'
    OperationsOverview:
      type: object
      additionalProperties: false
      required:
        - context
        - machines
        - cases
        - review_preview
        - provenance
      properties:
        context:
          type: object
          additionalProperties: false
          required:
            - factory_id
            - snapshot_id
            - plan_version
            - head_revision
            - captured_at
            - read_at
            - publication
          properties:
            factory_id:
              type: string
            snapshot_id:
              type: string
            plan_version:
              type: integer
              minimum: 0
            head_revision:
              type: integer
              minimum: 0
            captured_at:
              type: string
              format: date-time
            read_at:
              type: string
              format: date-time
            publication:
              anyOf:
                - type: object
                  additionalProperties: false
                  required:
                    - schedule_id
                    - schedule_revision
                    - basis_snapshot_id
                  properties:
                    schedule_id:
                      type: string
                    schedule_revision:
                      type: integer
                      minimum: 0
                    basis_snapshot_id:
                      type: string
                - type: 'null'
        machines:
          type: object
          additionalProperties: false
          required:
            - total
            - by_status
          properties:
            total:
              type: integer
              minimum: 0
            by_status:
              type: object
              additionalProperties: false
              required:
                - IDLE
                - RUNNING
                - WARNING
                - MAINTENANCE
                - FAILED
                - UNAVAILABLE
              properties:
                IDLE:
                  type: integer
                  minimum: 0
                RUNNING:
                  type: integer
                  minimum: 0
                WARNING:
                  type: integer
                  minimum: 0
                MAINTENANCE:
                  type: integer
                  minimum: 0
                FAILED:
                  type: integer
                  minimum: 0
                UNAVAILABLE:
                  type: integer
                  minimum: 0
        cases:
          type: object
          additionalProperties: false
          required:
            - LIVE
            - SIMULATION_ONLY
          properties:
            LIVE:
              type: object
              additionalProperties: false
              required:
                - total
                - by_status
                - by_processing
              properties:
                total:
                  type: integer
                  minimum: 0
                by_status:
                  type: object
                  additionalProperties: false
                  required:
                    - CREATED
                    - ANALYZING
                    - GENERATING
                    - VALIDATING
                    - EXPLAINING
                    - AWAITING_APPROVAL
                    - APPROVED
                    - MODIFIED
                    - REJECTED
                    - COMMITTED
                    - FAILED
                    - CANCELLED
                  properties:
                    CREATED:
                      type: integer
                      minimum: 0
                    ANALYZING:
                      type: integer
                      minimum: 0
                    GENERATING:
                      type: integer
                      minimum: 0
                    VALIDATING:
                      type: integer
                      minimum: 0
                    EXPLAINING:
                      type: integer
                      minimum: 0
                    AWAITING_APPROVAL:
                      type: integer
                      minimum: 0
                    APPROVED:
                      type: integer
                      minimum: 0
                    MODIFIED:
                      type: integer
                      minimum: 0
                    REJECTED:
                      type: integer
                      minimum: 0
                    COMMITTED:
                      type: integer
                      minimum: 0
                    FAILED:
                      type: integer
                      minimum: 0
                    CANCELLED:
                      type: integer
                      minimum: 0
                by_processing:
                  type: object
                  additionalProperties: false
                  required:
                    - PENDING
                    - RUNNING
                    - SUCCEEDED
                    - FAILED
                  properties:
                    PENDING:
                      type: integer
                      minimum: 0
                    RUNNING:
                      type: integer
                      minimum: 0
                    SUCCEEDED:
                      type: integer
                      minimum: 0
                    FAILED:
                      type: integer
                      minimum: 0
            SIMULATION_ONLY:
              type: object
              additionalProperties: false
              required:
                - total
                - by_status
                - by_processing
              properties:
                total:
                  type: integer
                  minimum: 0
                by_status:
                  type: object
                  additionalProperties: false
                  required:
                    - CREATED
                    - ANALYZING
                    - GENERATING
                    - VALIDATING
                    - EXPLAINING
                    - AWAITING_APPROVAL
                    - APPROVED
                    - MODIFIED
                    - REJECTED
                    - COMMITTED
                    - FAILED
                    - CANCELLED
                  properties:
                    CREATED:
                      type: integer
                      minimum: 0
                    ANALYZING:
                      type: integer
                      minimum: 0
                    GENERATING:
                      type: integer
                      minimum: 0
                    VALIDATING:
                      type: integer
                      minimum: 0
                    EXPLAINING:
                      type: integer
                      minimum: 0
                    AWAITING_APPROVAL:
                      type: integer
                      minimum: 0
                    APPROVED:
                      type: integer
                      minimum: 0
                    MODIFIED:
                      type: integer
                      minimum: 0
                    REJECTED:
                      type: integer
                      minimum: 0
                    COMMITTED:
                      type: integer
                      minimum: 0
                    FAILED:
                      type: integer
                      minimum: 0
                    CANCELLED:
                      type: integer
                      minimum: 0
                by_processing:
                  type: object
                  additionalProperties: false
                  required:
                    - PENDING
                    - RUNNING
                    - SUCCEEDED
                    - FAILED
                  properties:
                    PENDING:
                      type: integer
                      minimum: 0
                    RUNNING:
                      type: integer
                      minimum: 0
                    SUCCEEDED:
                      type: integer
                      minimum: 0
                    FAILED:
                      type: integer
                      minimum: 0
        review_preview:
          type: object
          additionalProperties: false
          required:
            - items
            - limit
            - has_more
            - filters
          properties:
            items:
              type: array
              maxItems: 6
              items:
                $ref: '#/components/schemas/DecisionCaseListItem'
            limit:
              const: 6
            has_more:
              type: boolean
            filters:
              type: object
              additionalProperties: false
              required:
                - factory_id
                - mode
                - status
              properties:
                factory_id:
                  type: string
                mode:
                  const: LIVE
                status:
                  const: AWAITING_APPROVAL
        provenance:
          type: object
          additionalProperties: false
          required:
            - machines
            - cases
          properties:
            machines:
              type: object
              additionalProperties: false
              required:
                - source
                - snapshot_id
                - observed_at
                - population
                - covered
              properties:
                source:
                  const: validated_current_snapshot
                snapshot_id:
                  type: string
                observed_at:
                  type: string
                  format: date-time
                population:
                  type: integer
                  minimum: 0
                covered:
                  type: integer
                  minimum: 0
            cases:
              type: object
              additionalProperties: false
              required:
                - source
                - scope
                - read_at
              properties:
                source:
                  const: decision_cases
                scope:
                  const: all_factory_cases_including_stale_and_terminal
                read_at:
                  type: string
                  format: date-time
      description: >-
        Additive HTTP summary, not a new domain model. All counts are case/machine counts, including zero
        buckets. LIVE and SIMULATION_ONLY are disjoint; lifecycle and processing dimensions overlap and must
        never be added. LIVE.by_status.AWAITING_APPROVAL is needs approval (including stale, not authorization
        to approve); LIVE.by_status.APPROVED is approved unpublished. Each mode by_processing.FAILED is
        processing errors; PENDING + RUNNING is in progress, including any terminal rows with those persisted
        processing states. All lifecycle buckets include stale and terminal cases; no stale-active metric.
        Machine coverage is every machine in the validated snapshot, not all physical machines or health
        coverage. No health/risk/utilization/history metric. read_at is the database read-snapshot acquisition
        time, not telemetry freshness or a concurrency token. Head revision does not fence case/worker
        changes. publication=null means no published schedule; published plan_version remains independent of
        current observation. Missing head returns 404, never an empty 200.
    FactoryDto:
      type: object
      additionalProperties: false
      required:
        - factory_id
        - name
        - created_at
        - updated_at
        - has_snapshot
      properties:
        factory_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: 'Trimmed; must not be blank. Unicode display name, no identity semantics.'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        has_snapshot:
          type: boolean
          description: >-
            True when a current Operations head exists; registry-only or historical factories without a head
            return false.
    FactoryMemberDto:
      type: object
      additionalProperties: false
      required:
        - membership_id
        - factory_id
        - user
        - active
        - granted_by
        - granted_at
        - grant_source
        - revoked_by
        - revoked_at
        - created_at
        - updated_at
      properties:
        membership_id:
          type: string
          format: uuid
        factory_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
        user:
          type: object
          additionalProperties: false
          required:
            - user_id
            - username
            - active
          properties:
            user_id:
              type: string
              format: uuid
            username:
              type: string
            active:
              type: boolean
        active:
          type: boolean
        granted_by:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
        granted_at:
          type: string
          format: date-time
        grant_source:
          type: string
        revoked_by:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
        revoked_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FactoryPageMeta:
      type: object
      additionalProperties: false
      required:
