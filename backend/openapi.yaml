                  policyId: 4e822e39-4b5b-497f-b3ec-864f9c41967b
                  seed: 42
                  attempt: 2
                  status: PENDING
                  stepsCompleted: 0
                  totalCost: null
                  failureCount: null
                  replacementCount: null
                  waitingSteps: null
                  queuedAt: "2026-09-02T09:00:00.000Z"
