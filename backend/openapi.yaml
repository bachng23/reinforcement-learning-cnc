openapi: 3.1.0
info:
  title: CNC Research Platform Product API
  version: 1.0.0
  description: |
    Authenticated Product API for creating CNC research experiments, queueing
    episodes, polling their lifecycle, and reading persisted contract-v2 events.

    Starting or retrying an episode only queues database work. Product API
    request handlers never execute the research engine.

    Clients may send `X-Request-Id` using 1-128 letters, numbers, dots,
    underscores, colons, or hyphens. The API echoes it in the response; when
    omitted or invalid, the API generates a UUID request id.
servers:
  - url: http://localhost:5000/api/v1
    description: Local backend
tags:
  - name: Policies
  - name: Experiments
  - name: Episodes
  - name: Maintenance
security:
  - cookieAuth: []
  - bearerAuth: []
paths:
  /operations/snapshot:
    get:
      tags:
        - Operations
      operationId: getOperationsSnapshot
      summary: Read current immutable FactorySnapshot
      description: >-
        Authenticated database read. ADMIN can read all factories; other roles need their database user UUID in
        OPERATIONS_FACTORY_ACCESS. Unknown or inaccessible factories return 404. Validates canonical schema 3.0 and
        SHA-256 content hashes. Cache-Control: no-store. Schedule is null if none exists. Schedule has no embedded
        schema_version per the canonical contract; meta supplies version 3.0.
      parameters:
        - name: factory_id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
          example: factory-demo-01
      responses:
        '200':
          description: Canonical payload and integrity metadata
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - meta
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    additionalProperties: false
                    required:
                      - factory_id
                      - snapshot_id
                      - schema_version
                      - captured_at
                      - plan_version
                      - current_schedule_id
                      - snapshot
                    properties:
                      factory_id:
                        type: string
                      snapshot_id:
                        type: string
                      schema_version:
                        const: '3.0'
                      captured_at:
                        type: string
                        format: date-time
                      plan_version:
                        type: integer
                        minimum: 0
                      current_schedule_id:
                        type:
                          - string
                          - 'null'
                      snapshot:
                        $ref: '#/components/schemas/OperationsFactorySnapshot'
                  meta:
                    $ref: '#/components/schemas/OperationsReadMeta'
        '400':
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsErrorResponse'
        '404':
          description: Unknown or inaccessible factory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsErrorResponse'
        '500':
          description: Stored content failed integrity checks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsErrorResponse'
        '503':
          description: Database or validator unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsErrorResponse'
  /schedules/current:
    get:
      tags:
        - Operations
      operationId: getCurrentOperationSchedule
      summary: Read current immutable Schedule
      description: >-
        Authenticated database read. ADMIN can read all factories; other roles need their database user UUID in
        OPERATIONS_FACTORY_ACCESS. Unknown or inaccessible factories return 404. Validates canonical schema 3.0 and
        SHA-256 content hashes. Cache-Control: no-store. Schedule is null if none exists. Schedule has no embedded
        schema_version per the canonical contract; meta supplies version 3.0.
      parameters:
        - name: factory_id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
          example: factory-demo-01
      responses:
        '200':
          description: Canonical payload and integrity metadata
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - meta
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    additionalProperties: false
                    required:
                      - factory_id
                      - snapshot_id
                      - plan_version
                      - schedule
                      - basis_snapshot
                      - commit
                    properties:
                      factory_id:
                        type: string
                      snapshot_id:
                        type: string
                      plan_version:
                        type: integer
                        minimum: 0
                      schedule:
                        anyOf:
                          - $ref: '#/components/schemas/OperationsSchedule'
                          - type: 'null'
                      basis_snapshot:
                        description: Immutable basis for the published schedule's resources, priorities and dependencies; null when no schedule exists. This can differ from the current observation identified by snapshot_id.
                        anyOf:
                          - $ref: '#/components/schemas/OperationsFactorySnapshot'
                          - type: 'null'
                      commit:
                        anyOf:
                          - type: object
                            additionalProperties: true
                          - type: 'null'
                  meta:
                    $ref: '#/components/schemas/OperationsReadMeta'
        '400':
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsErrorResponse'
        '404':
          description: Unknown or inaccessible factory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsErrorResponse'
        '500':
          description: Stored content failed integrity checks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsErrorResponse'
        '503':
          description: Database or validator unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsErrorResponse'
  /maintenance/decisions:
    get:
      tags: [Maintenance]
      operationId: listMaintenanceDecisionCandidates
      summary: List machine-level maintenance candidates from persisted simulator events
      description: >-
        Each complete observation, policy recommendation and step result produces one candidate per machine
        for the episode's current attempt. ADMIN can read all experiments; other users can read their own.
        Results are ordered by severity (CRITICAL first), estimated cost of one-step delay (highest first),
        creation time (newest first), then candidate id. The review status belongs to the shared joint
        recommendation; decisionId is null until POST /maintenance/decisions opens it for human review.
        Simulator results are research outcomes, not maintenance execution acknowledgements.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING_REVIEW, APPROVED, OVERRIDDEN, REJECTED]
        - name: severity
          in: query
          schema:
            type: string
            enum: [CRITICAL, HIGH, MEDIUM, LOW]
        - name: experiment
          in: query
          description: Experiment UUID.
          schema:
            type: string
            format: uuid
        - name: machine
          in: query
          description: Exact machine identifier.
          schema:
            $ref: '#/components/schemas/Identifier'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Filtered and prioritized candidates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceCandidateListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
    post:
      tags:
        - Maintenance
      operationId: createMaintenanceDecision
      summary: Open a recommendation for human review
      description: >-
        Requires authentication. ADMIN can access all decisions; other roles access decisions belonging to their
        own experiments. VIEWER can only read. No operation executes machine actions. OPERATOR, ENGINEER, ADMIN
        only. Idempotently returns the existing decision for this recommendation without resetting its status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - recommendationId
              properties:
                recommendationId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Pending or existing decision
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/MaintenanceDecision'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  '/maintenance/decisions/{id}':
    get:
      tags: [Maintenance]
      operationId: getMaintenanceDecisionCandidate
      summary: Get one machine-level maintenance candidate
      description: >-
        id is recommendation UUID, a tilde, and the machine identifier. The candidate is derived from the
        current episode attempt's persisted observation, recommendation and step result. Owner scope is
        identical to the list endpoint. The id differs from the UUID used by review/history endpoints.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F-]{36}~[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
      responses:
        '200':
          description: Candidate and its source snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceCandidateResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  '/maintenance/decisions/{id}/approve':
    post:
      tags:
        - Maintenance
      operationId: approveMaintenanceDecision
      summary: approve a pending maintenance decision
      description: >-
        Requires authentication. ADMIN can access all decisions; other roles access decisions belonging to their
        own experiments. VIEWER can only read. No operation executes machine actions. OPERATOR, ENGINEER, ADMIN
        only. Only PENDING_REVIEW -> APPROVED is allowed; repeated or concurrent decisions return 409. Records
        immutable recommendation and risk snapshots, authenticated actor and timestamp atomically with audit
        log.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceReviewInput'
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required:
                      - id
                      - status
                      - action
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        const: APPROVED
                      action:
                        $ref: '#/components/schemas/MaintenanceDecisionAction'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  '/maintenance/decisions/{id}/override':
    post:
      tags:
        - Maintenance
      operationId: overrideMaintenanceDecision
      summary: override a pending maintenance decision
      description: >-
        Requires authentication. ADMIN can access all decisions; other roles access decisions belonging to their
        own experiments. VIEWER can only read. No operation executes machine actions. OPERATOR, ENGINEER, ADMIN
        only. Only PENDING_REVIEW -> OVERRIDDEN is allowed; repeated or concurrent decisions return 409. Records
        immutable recommendation and risk snapshots, authenticated actor and timestamp atomically with audit
        log. A nonblank reason and replacementAction are required. The replacement must reference the same
        observation, cover every machine exactly once and change at least one action.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceOverrideInput'
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required:
                      - id
                      - status
                      - action
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        const: OVERRIDDEN
                      action:
                        $ref: '#/components/schemas/MaintenanceDecisionAction'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  '/maintenance/decisions/{id}/reject':
    post:
      tags:
        - Maintenance
      operationId: rejectMaintenanceDecision
      summary: reject a pending maintenance decision
      description: >-
        Requires authentication. ADMIN can access all decisions; other roles access decisions belonging to their
        own experiments. VIEWER can only read. No operation executes machine actions. OPERATOR, ENGINEER, ADMIN
        only. Only PENDING_REVIEW -> REJECTED is allowed; repeated or concurrent decisions return 409. Records
        immutable recommendation and risk snapshots, authenticated actor and timestamp atomically with audit
        log.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceReviewInput'
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required:
                      - id
                      - status
                      - action
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        const: REJECTED
                      action:
                        $ref: '#/components/schemas/MaintenanceDecisionAction'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  '/maintenance/decisions/{id}/history':
    get:
      tags:
        - Maintenance
      operationId: maintenanceDecisionHistory
      summary: Read immutable decision history
      description: >-
        Requires authentication. ADMIN can access all decisions; other roles access decisions belonging to their
        own experiments. VIEWER can only read. No operation executes machine actions. Actions are ordered by
        createdAt then id. Pending decisions have an empty history.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Decision and human review history
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    const: true
                  data:
                    allOf:
                      - $ref: '#/components/schemas/MaintenanceDecision'
                      - type: object
                        required:
                          - actions
                        properties:
                          actions:
                            type: array
                            items:
                              $ref: '#/components/schemas/MaintenanceDecisionAction'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /policies:
    get:
      tags: [Policies]
      summary: List available policies
      operationId: listPolicies
      responses:
        "200":
          description: Available policy catalog, ordered by policy key and version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyListResponse"
              example:
                success: true
                data:
                  - id: 4e822e39-4b5b-497f-b3ec-864f9c41967b
                    policyKey: threshold-uncertainty
                    version: 1.0.0
                    name: Threshold uncertainty policy
                    description: Replaces tools when configured risk limits are exceeded.
                    config:
                      strategy: THRESHOLD_UNCERTAINTY
                      decision_signal: POSTERIOR_RUL
                meta:
                  total: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /experiments:
    post:
      tags: [Experiments]
      summary: Create an experiment
      description: |
        Creates a validated experiment owned by the authenticated user. The
        embedded environment configuration is stored without changing its
        contract-v2 meaning. This operation does not create engine results.

        ADMIN, ENGINEER, and OPERATOR roles may create experiments.
      operationId: createExperiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExperimentRequest"
            example:
              name: Four-machine CVaR baseline
              description: Compare one policy over three deterministic seeds.
              policyKey: threshold-uncertainty
              policyVersion: 1.0.0
              episodeCount: 3
              environmentConfig:
                schema_version: "2.0"
                environment_id: cnc-fleet-v0.1
                number_of_machines: 4
                spare_capacity: 3
                initial_spares: 2
                horizon_steps: 480
                failure_threshold_um: 300
                seed: 42
                costs:
                  replacement_cost: 100
                  failure_cost: 5000
                  waiting_cost_per_step: 20
                  unused_life_cost_per_step: 2
                risk:
                  objective: CVAR
                  cvar_alpha: 0.95
      responses:
        "201":
          description: Experiment created in READY state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentResponse"
              example:
                success: true
                data:
                  id: b83c24df-ad54-442e-a399-9dc31708f157
                  experimentKey: experiment:b83c24df-ad54-442e-a399-9dc31708f157
                  name: Four-machine CVaR baseline
                  description: Compare one policy over three deterministic seeds.
                  schemaVersion: "2.0"
                  status: READY
                  episodeCount: 3
                  policy:
                    id: 4e822e39-4b5b-497f-b3ec-864f9c41967b
                    policyKey: threshold-uncertainty
                    version: 1.0.0
                    name: Threshold uncertainty policy
                    description: Replaces tools when configured risk limits are exceeded.
                  environmentConfig:
                    schema_version: "2.0"
                    environment_id: cnc-fleet-v0.1
                    number_of_machines: 4
                    spare_capacity: 3
                    initial_spares: 2
                    horizon_steps: 480
                    failure_threshold_um: 300
                    seed: 42
                    costs:
                      replacement_cost: 100
                      failure_cost: 5000
                      waiting_cost_per_step: 20
                      unused_life_cost_per_step: 2
                    risk:
                      objective: CVAR
                      cvar_alpha: 0.95
                  createdById: 1ef61fe2-41e7-47c6-94ee-3be1f7065f48
                  runRequestedAt: null
                  createdAt: "2026-09-02T08:00:00.000Z"
                  updatedAt: "2026-09-02T08:00:00.000Z"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The policy key or selected version does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                policyNotFound:
                  value:
                    success: false
                    error:
                      code: POLICY_NOT_FOUND
                      message: Policy not found
                versionNotFound:
                  value:
                    success: false
                    error:
                      code: POLICY_VERSION_NOT_FOUND
                      message: Policy version not found
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    get:
      tags: [Experiments]
      summary: List experiments
      operationId: listExperiments
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ExperimentStatus"
      responses:
        "200":
          description: Paginated experiments, ordered by creation time then id descending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentListResponse"
              example:
                success: true
                data:
                  - id: b83c24df-ad54-442e-a399-9dc31708f157
                    experimentKey: experiment:b83c24df-ad54-442e-a399-9dc31708f157
                    name: Four-machine CVaR baseline
                    description: Compare one policy over three deterministic seeds.
                    schemaVersion: "2.0"
                    status: READY
                    episodeCount: 3
                    policy:
                      id: 4e822e39-4b5b-497f-b3ec-864f9c41967b
                      policyKey: threshold-uncertainty
                      version: 1.0.0
                      name: Threshold uncertainty policy
                      description: Replaces tools when configured risk limits are exceeded.
                    createdById: 1ef61fe2-41e7-47c6-94ee-3be1f7065f48
                    createdAt: "2026-09-02T08:00:00.000Z"
                    updatedAt: "2026-09-02T08:00:00.000Z"
                meta:
                  page: 1
                  limit: 20
                  total: 1
                  totalPages: 1
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /experiments/{experimentId}:
    parameters:
      - $ref: "#/components/parameters/ExperimentId"
    get:
      tags: [Experiments]
      summary: Retrieve an experiment
      operationId: getExperiment
      responses:
        "200":
          description: Experiment detail, including its complete environment configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /experiments/{experimentId}/run:
    parameters:
      - $ref: "#/components/parameters/ExperimentId"
    post:
      tags: [Experiments]
      summary: Queue an experiment run
      description: |
        Atomically creates PENDING episodes and returns immediately. Episode
        seeds are deterministic: environmentConfig.seed + episode index.
        Replaying the same Idempotency-Key returns the same queued episodes.
      operationId: runExperiment
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Episodes have been queued, or the identical request was replayed.
          headers:
            Idempotency-Replayed:
              description: True when this response replays an earlier successful request.
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunExperimentResponse"
              example:
                success: true
                data:
                  experimentId: b83c24df-ad54-442e-a399-9dc31708f157
                  status: RUNNING
                  episodeCount: 3
                  episodes:
                    - id: 4dd4f09f-d099-4e11-827f-1ad32906d640
                      episodeKey: experiment:b83c24df-ad54-442e-a399-9dc31708f157:episode:0
                      seed: 42
                      status: PENDING
                      queuedAt: "2026-09-02T08:03:00.000Z"
                    - id: a09efff2-157a-48fd-bf3a-08817f48dc0b
                      episodeKey: experiment:b83c24df-ad54-442e-a399-9dc31708f157:episode:1
                      seed: 43
                      status: PENDING
                      queuedAt: "2026-09-02T08:03:00.000Z"
                    - id: 6aceab25-e7e0-4aec-9747-500731532011
                      episodeKey: experiment:b83c24df-ad54-442e-a399-9dc31708f157:episode:2
                      seed: 44
