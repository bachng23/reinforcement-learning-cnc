openapi: 3.1.0
info:
  title: CNC Research Platform Product API
  version: 1.0.0
  description: |
    Authenticated Product API for creating CNC research experiments, queueing
    episodes, polling their lifecycle, and reading persisted contract-v2 events.

    Starting or retrying an episode only queues database work. Product API
    request handlers never execute the research engine.

    Clients may send `X-Request-Id` using 1-128 letters, numbers, dots,
    underscores, colons, or hyphens. The API echoes it in the response; when
    omitted or invalid, the API generates a UUID request id.
servers:
  - url: http://localhost:5000/api/v1
    description: Local backend
tags:
  - name: Policies
  - name: Experiments
  - name: Episodes
  - name: Maintenance
security:
  - cookieAuth: []
  - bearerAuth: []
paths:
  /work-orders/eligible-assignees:
    get:
      tags:
        - Work Orders
      summary: eligible-assignees
      parameters:
        - in: query
          name: factory_id
          required: true
          schema:
            type: string
        - in: query
          name: query
          required: false
          schema:
            type: string
            maxLength: 100
        - in: query
          name: after
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Scoped authoritative result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderEligibleAssigneesResponse'
        '403':
          description: Management role required for assignee discovery
        '404':
          description: Factory or origin unavailable
  /work-orders/by-origin:
    get:
      tags:
        - Work Orders
      summary: by-origin
      parameters:
        - in: query
          name: factory_id
          required: true
          schema:
            type: string
        - in: query
          name: schedule_id
          required: true
          schema:
            type: string
        - in: query
          name: schedule_revision
          required: true
          schema:
            type: integer
            minimum: 1
        - in: query
          name: assignment_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Scoped authoritative result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderOriginResponse'
        '403':
          description: Management role required for assignee discovery
        '404':
          description: Factory or origin unavailable
  /maintenance-analytics/overview:
    get:
      tags:
        - Maintenance Analytics
      operationId: maintenanceAnalyticsOverview
      summary: Read maintenance analytics overview
      description: >-
        Active authenticated user; scoped factory authorization except definitions. See
        docs/maintenance-analytics.md for versioned cohorts, exclusions, comparison and pagination semantics.
      parameters:
        - in: query
          name: factory_id
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
            maxLength: 128
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date-time
            description: RFC3339 offset required. from < to <= read_at; at most 366 days.
        - in: query
          name: to
          required: true
          schema:
            type: string
            format: date-time
            description: RFC3339 offset required. from < to <= read_at; at most 366 days.
        - in: query
          name: timezone
          required: false
          schema:
            type: string
            default: UTC
            description: IANA timezone; calendar weeks begin Monday
        - in: query
          name: machine_id
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Consistent read; observation time is not telemetry freshness. No workflow writes.
          headers:
            Cache-Control:
              schema:
                const: no-store
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceAnalyticsOverviewResponse'
        '400':
          description: VALIDATION_ERROR or INVALID_CURSOR; rejects unknown/repeated query parameters
          headers:
            Cache-Control:
              schema:
                const: no-store
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderError'
        '401':
          description: UNAUTHORIZED
          headers:
            Cache-Control:
              schema:
                const: no-store
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderError'
        '404':
          description: FACTORY_NOT_FOUND or MAINTENANCE_ANALYTICS_MACHINE_NOT_FOUND
          headers:
            Cache-Control:
              schema:
                const: no-store
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderError'
        '500':
          description: MAINTENANCE_ANALYTICS_INTEGRITY_ERROR or INTERNAL_ERROR
          headers:
            Cache-Control:
              schema:
                const: no-store
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderError'
        '503':
          description: DB_UNAVAILABLE; no fallback or fabricated zero
          headers:
            Cache-Control:
              schema:
                const: no-store
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderError'
