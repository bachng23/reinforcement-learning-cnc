          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidEpisodeTransition"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /episodes/{episodeId}/cancel:
    parameters:
      - $ref: "#/components/parameters/EpisodeId"
    post:
      tags: [Episodes]
      summary: Cancel a pending episode
      description: |
        Atomically transitions PENDING to CANCELLED. Every other state is
        rejected with INVALID_EPISODE_TRANSITION.
      operationId: cancelEpisode
      responses:
        "200":
          description: Pending episode cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodeResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The episode is not PENDING.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: INVALID_EPISODE_TRANSITION
                  message: Episode is RUNNING; expected PENDING
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: pdm_token
      description: HttpOnly browser session cookie issued by POST /auth/login.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ExperimentId:
      name: experimentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EpisodeId:
      name: episodeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Attempt:
      name: attempt
      in: query
      required: false
      description: Episode attempt to read. Defaults to the current attempt.
      schema:
        type: integer
        minimum: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque client-generated key. Reuse it when retrying the same run request.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"

  responses:
    Unauthorized:
      description: Missing, malformed, expired, or inactive-user authentication.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: Authentication required
    Forbidden:
      description: The authenticated role does not permit this mutation. Ownership mismatches are intentionally returned as 404.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: FORBIDDEN
              message: You do not have permission to access this resource
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: NOT_FOUND
              message: Resource not found
    ValidationError:
      description: Request body, path, or query validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: horizon_steps must be greater than or equal to 1
              details:
                - path: environmentConfig.horizon_steps
                  code: too_small
                  message: Must be greater than or equal to 1
    Conflict:
      description: A uniqueness or resource-state conflict prevented the operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: CONFLICT
              message: The requested operation conflicts with current state
    InvalidEpisodeTransition:
      description: The episode is not in the state required by this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: INVALID_EPISODE_TRANSITION
              message: Episode must be FAILED before it can be retried
    DatabaseUnavailable:
      description: PostgreSQL is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: DB_UNAVAILABLE
              message: Database unavailable. Check DATABASE_URL and make sure Postgres is running.

  schemas:
    OperationsFactorySnapshot:
      additionalProperties: false
      properties:
        captured_at:
          format: date-time
          title: Captured At
          type: string
        current_schedule:
          anyOf:
            - $ref: '#/components/schemas/OperationsSchedule'
            - type: 'null'
          default: null
        factory_id:
          maxLength: 128
          minLength: 1
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
          title: Factory Id
          type: string
        health_snapshots:
          items:
            $ref: '#/components/schemas/OperationsHealthSnapshot'
          title: Health Snapshots
          type: array
        jobs:
          items:
            $ref: '#/components/schemas/OperationsProductionJob'
          title: Jobs
          type: array
        machines:
          items:
            $ref: '#/components/schemas/OperationsMachine'
          minItems: 1
          title: Machines
          type: array
        maintenance_requests:
          items:
            $ref: '#/components/schemas/OperationsMaintenanceRequest'
          title: Maintenance Requests
          type: array
        planning_window:
          $ref: '#/components/schemas/OperationsTimeWindow'
        schema_version:
          const: '3.0'
          default: '3.0'
          title: Schema Version
          type: string
        snapshot_id:
          maxLength: 128
          minLength: 1
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
          title: Snapshot Id
          type: string
        technicians:
          items:
            $ref: '#/components/schemas/OperationsTechnician'
          title: Technicians
          type: array
      required:
        - snapshot_id
        - factory_id
        - captured_at
        - planning_window
        - machines
      title: FactorySnapshot
      type: object
    OperationsSchedule:
      additionalProperties: false
      properties:
        assignments:
          items:
            $ref: '#/components/schemas/OperationsScheduleAssignment'
          title: Assignments
          type: array
        created_at:
          format: date-time
          title: Created At
          type: string
        factory_id:
          maxLength: 128
          minLength: 1
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
          title: Factory Id
          type: string
        planning_window:
          $ref: '#/components/schemas/OperationsTimeWindow'
        revision:
          minimum: 1
          title: Revision
          type: integer
        schedule_id:
          maxLength: 128
          minLength: 1
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
          title: Schedule Id
          type: string
      required:
        - schedule_id
        - factory_id
        - revision
        - planning_window
        - created_at
      title: Schedule
      type: object
    OperationsScheduleAssignment:
      additionalProperties: false
      properties:
        assignment_id:
          maxLength: 128
          minLength: 1
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
          title: Assignment Id
          type: string
        assignment_type:
          $ref: '#/components/schemas/OperationsAssignmentType'
        end_at:
          format: date-time
          title: End At
          type: string
        job_id:
          anyOf:
            - maxLength: 128
              minLength: 1
              pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
              type: string
            - type: 'null'
          default: null
          title: Job Id
        locked:
          default: false
          title: Locked
          type: boolean
        machine_id:
          maxLength: 128
          minLength: 1
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
          title: Machine Id
          type: string
        maintenance_request_id:
          anyOf:
            - maxLength: 128
              minLength: 1
              pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
              type: string
            - type: 'null'
          default: null
          title: Maintenance Request Id
        operation_id:
          anyOf:
            - maxLength: 128
              minLength: 1
              pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
              type: string
            - type: 'null'
          default: null
          title: Operation Id
        start_at:
          format: date-time
          title: Start At
          type: string
        status:
          $ref: '#/components/schemas/OperationsAssignmentStatus'
        technician_ids:
          items:
            maxLength: 128
            minLength: 1
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
            type: string
          title: Technician Ids
          type: array
      required:
        - assignment_id
        - assignment_type
        - status
        - machine_id
        - start_at
        - end_at
      title: ScheduleAssignment
      type: object
    OperationsAssignmentType:
      enum:
        - PRODUCTION
        - MAINTENANCE
        - BLOCKED_TIME
      title: AssignmentType
      type: string
    OperationsAssignmentStatus:
      enum:
        - PROPOSED
        - COMMITTED
        - RUNNING
        - COMPLETED
        - CANCELLED
      title: AssignmentStatus
      type: string
    OperationsTimeWindow:
      additionalProperties: false
      properties:
        end_at:
          format: date-time
          title: End At
          type: string
        start_at:
          format: date-time
          title: Start At
          type: string
      required:
        - start_at
        - end_at
      title: TimeWindow
      type: object
    OperationsHealthSnapshot:
      additionalProperties: false
      properties:
        confidence:
          enum:
            - LOW
            - MEDIUM
            - HIGH
          title: Confidence
          type: string
        failure_probability:
          maximum: 1
          minimum: 0
          title: Failure Probability
          type: number
        failure_probability_horizon_minutes:
          minimum: 1
          title: Failure Probability Horizon Minutes
          type: integer
        health_index:
          maximum: 1
          minimum: 0
          title: Health Index
          type: number
        health_snapshot_id:
          maxLength: 128
          minLength: 1
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
          title: Health Snapshot Id
          type: string
        machine_id:
          maxLength: 128
          minLength: 1
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
          title: Machine Id
          type: string
        observed_at:
          format: date-time
          title: Observed At
          type: string
        observed_wear_um:
          anyOf:
            - minimum: 0
              type: number
            - type: 'null'
          default: null
          title: Observed Wear Um
        rul_distribution:
          anyOf:
            - $ref: '#/components/schemas/OperationsDiscreteRULDistribution'
            - type: 'null'
          default: null
        source_model_version:
          maxLength: 128
          minLength: 1
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
          title: Source Model Version
          type: string
      required:
        - health_snapshot_id
        - machine_id
