        owner_user_id:
          type:
            - string
            - 'null'
          format: uuid
        revision:
          type: integer
          minimum: 1
        first_occurred_at:
          type: string
          format: date-time
        last_occurred_at:
          type: string
          format: date-time
        occurrence_count:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    IncidentEnvelope:
      type: object
