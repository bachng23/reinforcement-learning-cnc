        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  '/episodes/{episodeId}/summary':
    parameters:
      - $ref: '#/components/parameters/EpisodeId'
    get:
      tags:
        - Episodes
      summary: Retrieve the persisted final episode summary
      description: Returns a summary produced and persisted by the worker. The Product API does not calculate it.
      operationId: getEpisodeSummary
      parameters:
        - $ref: '#/components/parameters/Attempt'
      responses:
        '200':
          description: Persisted contract-v2 episode summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodeSummaryResponse'
              example:
                success: true
                data:
                  id: 97153227-00c5-4074-ad87-a675260e063d
                  attempt: 1
                  payload:
                    schema_version: '2.0'
                    episode_id: 'experiment:b83c24df-ad54-442e-a399-9dc31708f157:episode:0'
                    policy_id: threshold-uncertainty
                    seed: 42
                    steps_completed: 480
                    total_cost: 840
                    failure_count: 0
