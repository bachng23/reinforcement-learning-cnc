  /decision-cases:
    get:
      summary: Find decision cases within one authorized factory
      description: >-
        Read-only summary list. All authenticated roles require factory access; ADMIN can access any existing
        factory. Missing/inaccessible factories return the same 404. Sort: created_at DESC, id DESC; full
        PostgreSQL microsecond precision is retained in the cursor. Single-value filters combine with AND. No
        raw request, snapshot, artifact, note, lease or receipt. Each page uses repeatable-read for consistent
        case/head/provenance. stale compares original case basis with current head, including after its own
        commit. Opaque signed cursors bind actor/factory/status/mode; keep this scope on subsequent requests.
        Limit may change. Malformed, tampered, unsupported or scope-mismatched cursors return INVALID_CURSOR.
        No time expiry; signing-key rotation invalidates cursors. Every page rechecks authorization. Fixed
        data has no duplicated/missing items; pages are not a cross-request snapshot, so restart without a
        cursor when refreshing a changing dataset. has_more uses limit+1; next_cursor is null on final/empty
        pages. No total count.
      parameters:
        - in: query
          name: factory_id
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
        - in: query
          name: status
          required: false
          schema:
            $ref: '#/components/schemas/CaseContractDecisionCaseStatus'
        - in: query
          name: mode
          required: false
          schema:
            enum:
              - LIVE
              - SIMULATION_ONLY
        - in: query
          name: cursor
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 2048
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: 'Summary page. Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionCaseListResponse'
              examples:
                committed:
                  value:
                    success: true
                    data:
                      - schema_version: '3.0'
                        decision_case_id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                        mode: LIVE
                        status: COMMITTED
                        snapshot_id: snapshot-1
                        created_at: '2026-10-09T04:00:00.000Z'
                        updated_at: '2026-10-09T04:00:00.000Z'
                        recommendation_id: recommendation-1
                        committed_schedule_id: schedule-1
                        error_code: null
                        factory_id: factory-1
                        base_plan_version: 0
                        case_revision: 8
                        current_context:
                          snapshot_id: snapshot-1
                          plan_version: 1
                        stale: true
                        human_decision:
                          decision: APPROVE
                          recommendation_id: recommendation-1
                          candidate_plan_id: candidate-1
                          candidate_version: 17
                          actor_id: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                          decided_at: '2026-10-09T04:00:00.000Z'
                        publication:
                          schedule_id: schedule-1
                          schedule_revision: 9
                          plan_version: 1
                          snapshot_id: snapshot-1
                          actor_id: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                          committed_at: '2026-10-09T04:00:00.000Z'
                    meta:
                      factory_id: factory-1
                      limit: 25
                      has_more: false
                      next_cursor: null
                empty:
                  value:
                    success: true
                    data: []
                    meta:
                      factory_id: factory-1
                      limit: 25
                      has_more: false
                      next_cursor: null
        '400':
          description: >-
            VALIDATION_ERROR: missing/invalid/unknown/repeated query parameters or invalid limit.
            INVALID_CURSOR: cursor format, signature, version or scope error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: INVALID_CURSOR
                  message: >-
                    VALIDATION_ERROR: missing/invalid/unknown/repeated query parameters or invalid limit.
                    INVALID_CURSOR: cursor format, signature, version or scope error.
                requestId: list-request-1
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: UNAUTHORIZED
                  message: UNAUTHORIZED
                requestId: list-request-1
        '404':
          description: 'FACTORY_NOT_FOUND: absent or inaccessible factory'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: FACTORY_NOT_FOUND
                  message: 'FACTORY_NOT_FOUND: absent or inaccessible factory'
                requestId: list-request-1
        '503':
          description: FACTORY_ACCESS_UNAVAILABLE or DB_UNAVAILABLE; CURSOR_SIGNING_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: FACTORY_ACCESS_UNAVAILABLE
                  message: FACTORY_ACCESS_UNAVAILABLE or DB_UNAVAILABLE
                requestId: list-request-1
