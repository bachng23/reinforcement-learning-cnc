components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: pdm_token
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    key:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
  schemas:
    DemoBatch:
      type: object
      additionalProperties: false
      properties:
        batchId:
          type: string
        productName:
          type: string
        quantity:
          anyOf:
            - type: integer
              minimum: 0
            - type: 'null'
        dueAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
      required:
        - batchId
        - productName
        - quantity
        - dueAt
    DemoMachineProfile:
      type: object
      additionalProperties: false
      properties:
        machineId:
          enum:
            - M1
            - M2
            - M3
        simulatorMachineIndex:
          type: integer
          minimum: 0
          maximum: 2
        name:
          type: string
        type:
          type: string
        operation:
          type: string
        operationOrder:
          type: integer
          minimum: 1
          maximum: 3
        lineId:
          type: string
        location:
          type: object
          additionalProperties: false
          properties:
            zone:
              type: string
            bay:
              type: string
            x:
              type: integer
              minimum: 0
            'y':
              type: integer
              minimum: 0
          required:
            - zone
            - bay
            - x
            - 'y'
        assignedBatch:
          $ref: '#/components/schemas/DemoBatch'
      required:
        - machineId
        - simulatorMachineIndex
        - name
        - type
        - operation
        - operationOrder
        - lineId
        - location
        - assignedBatch
    DemoContext:
      type: object
      additionalProperties: false
      properties:
        contextVersion:
          type: string
        contextOrigin:
          const: ILLUSTRATIVE_DEMO
        factory:
          type: object
          additionalProperties: false
          properties:
            factoryId:
              type: string
            name:
              type: string
          required:
            - factoryId
            - name
        layout:
          type: object
          additionalProperties: false
          properties:
            coordinateUnit:
              const: SCHEMATIC_GRID
            columns:
              type: integer
              minimum: 0
            rows:
              type: integer
              minimum: 0
          required:
            - coordinateUnit
            - columns
            - rows
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              lineId:
                type: string
              name:
                type: string
              machineIds:
                type: array
                items:
                  enum:
                    - M1
                    - M2
                    - M3
                maxItems: 3
            required:
              - lineId
              - name
              - machineIds
        machines:
          type: array
          items:
            $ref: '#/components/schemas/DemoMachineProfile'
          maxItems: 3
      required:
        - contextVersion
        - contextOrigin
        - factory
        - layout
        - lines
        - machines
    DemoMachineState:
      type: object
      additionalProperties: false
      properties:
        machineId:
          enum:
            - M1
            - M2
            - M3
        simulatorMachineIndex:
          type: integer
          minimum: 0
          maximum: 2
        machineState:
          enum:
            - WORKING
            - BREAKDOWN
            - IN_SERVICE
        components:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              componentId:
                enum:
                  - C1
                  - C2
              ageTicks:
                type: integer
                minimum: 0
              failed:
                type: boolean
            required:
              - componentId
              - ageTicks
              - failed
          maxItems: 2
        currentJobs:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              technicianId:
                type: string
              componentId:
                enum:
                  - C1
                  - C2
              kind:
                enum:
                  - PM
                  - CM
              remainingTicks:
                type: integer
                minimum: 1
            required:
              - technicianId
              - componentId
              - kind
              - remainingTicks
          maxItems: 3
      required:
        - machineId
        - simulatorMachineIndex
        - machineState
        - components
        - currentJobs
    DemoPhysicalEvidence:
      type: object
      additionalProperties: false
      properties:
        recordIndex:
          type: integer
          minimum: 0
          maximum: 63
        eventIndex:
          type: integer
          minimum: 0
        tick:
          type: integer
          minimum: 0
          maximum: 64
        type:
          enum:
            - failure
            - start
            - completion
        machineId:
          enum:
            - M1
            - M2
            - M3
        componentId:
          enum:
            - C1
