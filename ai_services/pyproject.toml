[project]
name = "ai-services"
version = "0.1.0"
description = "Risk-aware multi-agent predictive maintenance system — AI services"
readme = "README.md"
requires-python = ">=3.12.10"
dependencies = [
    "pydantic>=2.13.3",
    "numpy>=2.4.4",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "scipy>=1.15.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
